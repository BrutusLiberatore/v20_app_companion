name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Check EN/IT string parity
        run: |
          en=$(grep -o '<string ' app/src/main/res/values/strings.xml | wc -l)
          it=$(grep -o '<string ' app/src/main/res/values-it/strings.xml | wc -l)
          echo "EN=$en IT=$it"
          [ "$en" = "$it" ]

      - name: Check for replacement characters (U+FFFD)
        run: |
          if grep -rIn $'\uFFFD' app/src --include='*.kt' --include='*.xml'; then
            echo "U+FFFD replacement characters found in sources"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Run unit tests
        run: ./gradlew test --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
